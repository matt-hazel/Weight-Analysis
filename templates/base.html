<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Weights{% endblock %}</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #222; }
    header { background: #1f2937; color: #fff; padding: 12px 24px; display: flex; gap: 24px; align-items: center; }
    header a { color: #cbd5e1; text-decoration: none; }
    header a:hover { color: #fff; }
    main { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .tabs button { padding: 8px 14px; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; cursor: pointer; }
    .tabs button.active { background: #1f2937; color: #fff; border-color: #1f2937; }
    .panel { display: none; background: #fff; border-radius: 8px; padding: 12px; }
    .panel.active { display: block; }
  </style>
</head>
<body>
  <header>
    <strong>Weight Dashboard</strong>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
